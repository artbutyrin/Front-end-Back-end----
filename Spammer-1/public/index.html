<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Розсилка</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
</head>
<body>
  <div class="shell">
    <aside class="rail">
      <div class="brand">
        <span class="brand-mark">П</span>
        <div>
          <div class="brand-title">Пособник</div>
          <div class="brand-sub">пошта для розсилки</div>
        </div>
      </div>
      <nav>
        <a class="nav-link active" href="/"><span class="nav-ico">✉</span> Розсилка</a>
        <a class="nav-link" href="/admin.html"><span class="nav-ico">☺</span> Контакти</a>
      </nav>
    </aside>
    <div class="resizer" data-pane="rail" role="separator" aria-orientation="vertical" title="Потягніть, щоб змінити ширину"></div>

    <section class="list-pane">
      <header class="pane-head">
        <h1>Отримувачі</h1>
        <label class="check-all" for="select-all">
          <input class="form-check-input" type="checkbox" id="select-all">
          Обрати всіх
        </label>
      </header>
      <ul class="mail-list" id="contacts"></ul>
      <form id="quick-contact" class="quick-add">
        <input name="lastName" placeholder="Прізвище" required>
        <input name="firstName" placeholder="Ім'я" required>
        <input name="middleName" placeholder="По батькові" required>
        <input name="email" type="email" placeholder="Email" required>
        <button class="btn-line quick-span" type="submit">Додати адресата</button>
      </form>
    </section>
    <div class="resizer" data-pane="list" role="separator" aria-orientation="vertical" title="Потягніть, щоб змінити ширину"></div>

    <section class="read-pane">
      <form id="mail-form" class="compose">
        <div class="command-bar">
          <button class="btn-send" type="submit">Надіслати</button>
          <select class="template-select" id="template">
            <option value="">Свій текст</option>
          </select>
        </div>
        <h1 class="compose-title">Новий лист</h1>
        <label class="field-row">
        </label>
        <label class="field-row">
          <span>Тема</span>
          <input class="subject-input" id="subject" required>
        </label>
        <textarea class="body-input" id="text" rows="8" required placeholder="Напишіть текст листа"></textarea>
      </form>
      <div id="result" class="result"></div>
    </section>
  </div>
  <script src="js/mail.js"></script>
  <script src="js/panes.js"></script>
</body>
</html>
