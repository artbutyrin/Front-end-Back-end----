<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Розсилка</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-4">
    <p><a href="/admin.html">Контакти</a></p>
    <h1 class="mb-4">Розсилка</h1>

    <form id="quick-contact" class="row g-2 mb-3">
      <div class="col-md-3">
        <input class="form-control" name="lastName" placeholder="Прізвище" required>
      </div>
      <div class="col-md-2">
        <input class="form-control" name="firstName" placeholder="Ім'я" required>
      </div>
      <div class="col-md-2">
        <input class="form-control" name="middleName" placeholder="По батькові" required>
      </div>
      <div class="col-md-3">
        <input class="form-control" name="email" type="email" placeholder="Email" required>
      </div>
      <div class="col-md-2">
        <button class="btn btn-outline-primary w-100" type="submit">Додати</button>
      </div>
    </form>

    <div class="form-check mb-2">
      <input class="form-check-input" type="checkbox" id="select-all">
      <label class="form-check-label" for="select-all">Обрати всіх</label>
    </div>
    <ul class="list-group mb-4" id="contacts"></ul>

    <form id="mail-form">
      <div class="mb-3">
        <label class="form-label" for="template">Готове повідомлення</label>
        <select class="form-select" id="template">
          <option value="">Свій текст</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label" for="subject">Тема</label>
        <input class="form-control" id="subject" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="text">Текст</label>
        <textarea class="form-control" id="text" rows="6" required></textarea>
      </div>
      <button class="btn btn-primary" type="submit">Надіслати</button>
    </form>

    <pre class="mt-4" id="result"></pre>
  </div>
  <script src="js/mail.js"></script>
</body>
</html>
