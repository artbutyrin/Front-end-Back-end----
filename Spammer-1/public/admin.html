<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Контакти</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-4">
    <h1 class="mb-4">Список розсилки</h1>

    <a href="/">Розсилка</a>
    <a href="/admin.html">Контакти</a>

    <form id="contact-form" class="row g-2 mb-4">
      <input type="hidden" id="contact-id">
      <div class="col-md-3">
        <input class="form-control" id="lastName" placeholder="Прізвище" required>
      </div>
      <div class="col-md-3">
        <input class="form-control" id="firstName" placeholder="Ім'я" required>
      </div>
      <div class="col-md-3">
        <input class="form-control" id="middleName" placeholder="По батькові" required>
      </div>
      <div class="col-md-3">
        <input class="form-control" id="email" type="email" placeholder="Email" required>
      </div>
      <div class="col-12">
        <button class="btn btn-primary" type="submit">Зберегти</button>
        <button class="btn btn-secondary" type="button" id="cancel-edit">Скасувати</button>
      </div>
    </form>

    <table class="table table-striped bg-white">
      <thead>
        <tr>
          <th>Прізвище</th>
          <th>Ім'я</th>
          <th>По батькові</th>
          <th>Email</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="contacts"></tbody>
    </table>
  </div>
  <script src="js/admin.js"></script>
</body>
</html>
