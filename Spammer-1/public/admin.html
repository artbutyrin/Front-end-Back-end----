<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Контакти</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/app.css" rel="stylesheet">
</head>
<body>
  <div class="shell">
    <aside class="rail">
      <div class="brand">
        <span class="brand-mark">П</span>
        <div>
          <div class="brand-title">Пособник</div>
          <div class="brand-sub">пошта для розсилки</div>
        </div>
      </div>
      <nav>
        <a class="nav-link" href="/"><span class="nav-ico">✉</span> Розсилка</a>
        <a class="nav-link active" href="/admin.html"><span class="nav-ico">☺</span> Контакти</a>
      </nav>
      <p class="rail-foot">Тут зберігається адресна книга розсилки.</p>
    </aside>
    <div class="resizer" data-pane="rail" role="separator" aria-orientation="vertical" title="Потягніть, щоб змінити ширину"></div>

    <section class="list-pane">
      <header class="pane-head">
        <h1>Адресна книга</h1>
      </header>
      <div class="people-wrap">
        <table class="people-table">
          <thead>
            <tr>
              <th>Контакт</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="contacts"></tbody>
        </table>
      </div>
    </section>
    <div class="resizer" data-pane="list" role="separator" aria-orientation="vertical" title="Потягніть, щоб змінити ширину"></div>

    <section class="read-pane">
      <div class="command-bar">
        <button class="btn-save" type="submit" form="contact-form">Зберегти</button>
        <button class="btn-quiet" type="button" id="cancel-edit">Скасувати</button>
      </div>
      <h1 class="compose-title">Картка контакту</h1>
      <form id="contact-form" class="card-form">
        <input type="hidden" id="contact-id">
        <input class="field" id="lastName" placeholder="Прізвище" required>
        <input class="field" id="firstName" placeholder="Ім'я" required>
        <input class="field" id="middleName" placeholder="По батькові" required>
        <input class="field" id="email" type="email" placeholder="Email" required>
      </form>
    </section>
  </div>
  <script src="js/admin.js"></script>
  <script src="js/panes.js"></script>
</body>
</html>
